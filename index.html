<!DOCTYPE html>
<html lang="en">
<head>

    <title>Long View Research</title>
    <style>
        body {
            background-color: #f7f7f5;
            color: #666666;
            font-family: "Georgia", "Times New Roman", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", serif;
            display: flex;

            height: 100vh;

            -webkit-font-smoothing: antialiased;
